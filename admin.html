<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TF prototipo komentarai | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#FEFDE9;color:#123044;margin:0;padding:24px}h1{color:#005386}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}select,input,button{padding:10px;border-radius:10px;border:1px solid #D8E8EF;font-size:15px}button{cursor:pointer;font-weight:bold}.card{background:white;border:1px solid #D8E8EF;border-radius:16px;padding:16px;margin-bottom:12px}.meta{color:#65737A;font-size:13px;margin-bottom:8px}.comment{font-size:16px;margin-bottom:12px;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.delete{background:#FDECEC;color:#B42318}.duplicate{background:#FFF3CD;color:#856404}.bad{background:#FFE3E3;color:#B42318}.restore{background:#D9F0FA;color:#005386}.export{background:#E64011;color:white;border:none}.refresh{background:#005386;color:white;border:none}.empty{background:white;border:1px dashed #D8E8EF;border-radius:16px;padding:24px;text-align:center;color:#65737A}
</style>
</head>
<body>
<h1>TF prototipo komentarai</h1>
<div class="controls">
  <select id="stepFilter" onchange="loadComments()">
    <option value="">Visi žingsniai</option>
    <option value="1">1 Pradžios langas</option>
    <option value="2">2 Platforma</option>
    <option value="3">3 Turinio tipas</option>
    <option value="5">5 Nepilnametis</option>
    <option value="6">6 Nuoroda</option>
    <option value="7">7 Įrodymai</option>
    <option value="8">8 Aprašymas</option>
    <option value="9">9 Kreiptasi į platformą</option>
    <option value="10">10 Pasiekiamumas / pasikartojimas</option>
    <option value="13">13 Kontaktai</option>
    <option value="14">14 Peržiūra</option>
    <option value="15">15 Pabaiga</option>
    <option value="16">16 Survey</option>
    <option value="98">98 Platformų kontaktai</option>
    <option value="99">99 Tik pasikalbėti</option>
  </select>
  <select id="statusFilter" onchange="loadComments()">
    <option value="active">Active</option>
    <option value="deleted">Deleted</option>
    <option value="duplicate">Duplicate</option>
    <option value="inappropriate">Inappropriate</option>
    <option value="">Visi statusai</option>
  </select>
  <input id="searchInput" placeholder="Ieškoti komentaruose..." oninput="loadComments()" />
  <button class="refresh" onclick="loadComments()">Atnaujinti</button>
  <button class="export" onclick="exportCsv()">Eksportuoti CSV</button>
</div>
<div id="count"></div>
<div id="comments"></div>
<script>
const SUPABASE_URL = "https://zqvaqlmxstjindlcbef.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xAQ2OqaewT3seUJkNUE1dg_nTU8OlQj";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const stepTitles = {
  "1":"Pradžios langas",
  "2":"Platformos pasirinkimas",
  "3":"Turinio tipo pasirinkimas",
  "5":"Nepilnamečio įtraukimas",
  "6":"Nuorodos laukas",
  "7":"Įrodymai",
  "8":"Aprašymas",
  "9":"Ar jau kreiptasi į platformą",
  "10":"Turinio pasiekiamumas ir pasikartojimas",
  "13":"Kontaktai",
  "14":"Peržiūra",
  "15":"Pabaigos langas",
  "16":"Survey",
  "98":"Platformų kontaktai",
  "99":"Tik pasikalbėti"
};
let currentRows = [];

async function loadComments(){
  const step = document.getElementById("stepFilter").value;
  const status = document.getElementById("statusFilter").value;
  const search = document.getElementById("searchInput").value.toLowerCase();

  let query = supabaseClient
    .from("prototype_comments")
    .select("id, step_id, comment_text, session_id, status, created_at")
    .order("created_at", { ascending:false });

  if(step) query = query.eq("step_id", step);
  if(status) query = query.eq("status", status);

  const { data, error } = await query;
  if(error){
    document.getElementById("comments").innerHTML = `<p>Klaida: ${escapeHtml(error.message)}</p>`;
    return;
  }

  currentRows = (data || []).filter(row => {
    const title = stepTitles[String(row.step_id)] || "";
    return !search ||
      (row.comment_text || "").toLowerCase().includes(search) ||
      title.toLowerCase().includes(search) ||
      String(row.step_id || "").includes(search);
  });

  renderComments(currentRows);
}

function renderComments(rows){
  document.getElementById("count").innerHTML = `<p>Rodoma komentarų: <b>${rows.length}</b></p>`;
  if(!rows.length){
    document.getElementById("comments").innerHTML = `<div class="empty">Komentarų nėra pagal pasirinktą filtrą.</div>`;
    return;
  }
  document.getElementById("comments").innerHTML = rows.map(row => {
    const stepId = String(row.step_id || "-");
    const title = stepTitles[stepId] || "Nežinomas žingsnis";
    const created = row.created_at ? new Date(row.created_at).toLocaleString("lt-LT") : "-";
    return `
      <div class="card">
        <div class="meta">Step ${escapeHtml(stepId)} | ${escapeHtml(title)} | ${escapeHtml(row.status)} | ${escapeHtml(created)}</div>
        <div class="comment">${escapeHtml(row.comment_text)}</div>
        <div class="meta">Session: ${escapeHtml(row.session_id || "-")}</div>
        <div class="actions">
          <button class="delete" onclick="updateStatus('${row.id}','deleted')">Trinti / slėpti</button>
          <button class="duplicate" onclick="updateStatus('${row.id}','duplicate')">Dublikatas</button>
          <button class="bad" onclick="updateStatus('${row.id}','inappropriate')">Netinkamas</button>
          <button class="restore" onclick="updateStatus('${row.id}','active')">Atstatyti</button>
        </div>
      </div>`;
  }).join("");
}

async function updateStatus(id, status){
  const { error } = await supabaseClient
    .from("prototype_comments")
    .update({ status })
    .eq("id", id);
  if(error){
    alert("Nepavyko atnaujinti. Patikrink UPDATE policy. " + error.message);
    return;
  }
  loadComments();
}

function exportCsv(){
  const header = ["id","step_id","step_title","comment_text","session_id","status","created_at"];
  const rows = currentRows.map(row => [
    row.id,
    row.step_id,
    stepTitles[String(row.step_id)] || "",
    row.comment_text,
    row.session_id,
    row.status,
    row.created_at
  ].map(value => `"${String(value ?? "").replaceAll('"','""')}"`).join(","));
  const csv = [header.join(","), ...rows].join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "tf_prototype_comments.csv";
  link.click();
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

loadComments();
</script>
</body>
</html>
